<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t1">
  <title id="t1">Police car outside a house at dusk</title>
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f2e"/>
      <stop offset="55%" style="stop-color:#2d3548"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="window" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f4d58d"/>
      <stop offset="100%" style="stop-color:#c9a227"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#sky)"/>
  <!-- Ground -->
  <rect y="320" width="800" height="100" fill="#151a22"/>
  <!-- House -->
  <path d="M120 320 L120 200 L240 120 L360 200 L360 320 Z" fill="#2a2420" stroke="#3d3530" stroke-width="2"/>
  <polygon points="100,200 240,95 380,200" fill="#352a22" stroke="#4a3d32" stroke-width="2"/>
  <rect x="175" y="230" width="55" height="70" fill="url(#window)" opacity="0.95"/>
  <rect x="255" y="230" width="55" height="70" fill="url(#window)" opacity="0.85"/>
  <rect x="200" y="270" width="45" height="50" fill="#1a1512"/>
  <!-- Porch light glow -->
  <circle cx="222" cy="215" r="28" fill="#ffd56a" opacity="0.12"/>
  <!-- Tree silhouette -->
  <ellipse cx="620" cy="310" rx="90" ry="120" fill="#0f1318"/>
  <rect x="605" y="280" width="30" height="80" fill="#121820"/>
  <!-- Police car -->
  <g transform="translate(400, 268)">
    <rect x="0" y="28" width="220" height="38" rx="6" fill="#1c2333" stroke="#3a4558" stroke-width="2"/>
    <path d="M35 28 L55 0 L165 0 L185 28 Z" fill="#252d3d" stroke="#3a4558" stroke-width="2"/>
    <rect x="60" y="8" width="45" height="18" rx="2" fill="#87ceeb" opacity="0.35"/>
    <rect x="115" y="8" width="45" height="18" rx="2" fill="#87ceeb" opacity="0.25"/>
    <circle cx="45" cy="66" r="16" fill="#0a0a0c" stroke="#333" stroke-width="2"/>
    <circle cx="175" cy="66" r="16" fill="#0a0a0c" stroke="#333" stroke-width="2"/>
    <!-- Light bar -->
    <rect x="85" y="-6" width="50" height="10" rx="2" fill="#222"/>
    <rect x="88" y="-4" width="18" height="6" rx="1" fill="#c41e3a" opacity="0.9"/>
    <rect x="112" y="-4" width="18" height="6" rx="1" fill="#1e3a8a" opacity="0.9"/>
  </g>
</svg>
