# GitHub Pages — static HTML/JS (no Jekyll).
#
# REQUIRED ONCE (before this workflow can deploy):
#   Repo → Settings → Pages → Build and deployment → Source → "GitHub Actions" → Save
# If Source is still "Deploy from a branch" or not set, the deploy job will fail.
#
# Easier alternative: use only "Deploy from a branch" (main, /root) and delete this file.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Do NOT use configure-pages here: it calls GET /repos/.../pages and 404s until
      # Settings → Pages → Source is set to "GitHub Actions" (chicken-and-egg).
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
